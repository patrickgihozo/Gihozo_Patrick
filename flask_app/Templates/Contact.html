<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
</head>
<body>
    <h1>{{ page_title }}</h1>

    <p>Welcome, {{ name }}.</p>
    <p>Email: {{ email }}</p>
    <p>Phone: {{ phone }}</p>

    <h3>Services</h3>
    <ul>
        {% for service in services %}
            <li>{{ service }}</li>
        {% endfor %}
    </ul>
</body>
</html>
